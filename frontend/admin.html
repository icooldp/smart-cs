<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>客服管理后台</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,"Microsoft YaHei",sans-serif; background:#f5f6fa; }
        .admin-wrap { max-width:1100px; margin:0 auto; padding:24px; }
        .admin-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
        .admin-header h1 { font-size:24px; color:#333; }
        .admin-header a { color:#667eea; text-decoration:none; }
        .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
        .stat-card { background:white; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .stat-card .num { font-size:32px; font-weight:bold; color:#667eea; }
        .stat-card .label { font-size:13px; color:#999; margin-top:4px; }
        .panel { background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.06); margin-bottom:24px; }
        .panel h2 { font-size:18px; margin-bottom:16px; color:#333; }
        .panel-tabs { display:flex; gap:12px; margin-bottom:16px; }
        .panel-tabs button { padding:8px 16px; border:1px solid #ddd; background:white; border-radius:8px; cursor:pointer; }
        .panel-tabs button.active { background:#667eea; color:white; border-color:#667eea; }
        .kb-form { display:flex; flex-direction:column; gap:12px; margin-bottom:20px; }
        .kb-form input, .kb-form textarea, .kb-form select { padding:10px 14px; border:1px solid #ddd; border-radius:8px; font-size:14px; }
        .kb-form textarea { min-height:80px; resize:vertical; }
        .kb-form button { padding:10px 24px; background:#667eea; color:white; border:none; border-radius:8px; cursor:pointer; font-size:14px; align-self:flex-start; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:12px; text-align:left; border-bottom:1px solid #eee; font-size:14px; }
        th { background:#f9f9f9; font-weight:600; }
        .del-btn { color:#ff4d4f; cursor:pointer; background:none; border:none; }
        .import-area { border:2px dashed #ddd; border-radius:8px; padding:20px; text-align:center; margin-bottom:16px; }
    </style>
</head>
<body>
<div class="admin-wrap">
    <div class="admin-header">
        <h1>📊 智能客服管理后台</h1>
        <a href="index.html">← 返回聊天</a>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="num" id="s1">-</div><div class="label">总会话数</div></div>
        <div class="stat-card"><div class="num" id="s2">-</div><div class="label">进行中</div></div>
        <div class="stat-card"><div class="num" id="s3">-</div><div class="label">转人工次数</div></div>
        <div class="stat-card"><div class="num" id="s4">-</div><div class="label">自动解决率</div></div>
    </div>

    <div class="panel">
        <h2>📚 知识库管理</h2>
        <div class="panel-tabs">
            <button class="active" onclick="showTab('add', this)">➕ 添加问答</button>
            <button onclick="showTab('import', this)">📥 批量导入</button>
            <button onclick="showTab('list', this)">📋 全部列表</button>
        </div>

        <div id="tab-add">
            <div class="kb-form">
                <input type="text" id="kb-q" placeholder="常见问题，如：怎么退货？">
                <textarea id="kb-a" placeholder="标准答案..."></textarea>
                <select id="kb-cat">
                    <option>基本信息</option><option>售后服务</option><option>物流</option>
                    <option>订单</option><option>支付</option><option>会员</option><option>财务</option>
                </select>
                <button onclick="addKnowledge()">添加到知识库</button>
            </div>
        </div>

        <div id="tab-import" style="display:none">
            <div class="import-area">
                <p>选择 JSON 文件导入（格式：question/answer/category）</p><br>
                <input type="file" id="importFile" accept=".json"><br><br>
                <button onclick="importFile()" style="padding:8px 20px;background:#667eea;color:white;border:none;border-radius:6px;cursor:pointer">开始导入</button>
            </div>
        </div>

        <div id="tab-list" style="display:none">
            <table>
                <thead><tr><th>#</th><th>分类</th><th>问题</th><th>答案</th><th>操作</th></tr></thead>
                <tbody id="kbList"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API = "http://localhost:8000";

    async function loadStats() {
        const resp = await fetch(API + "/api/stats/overview");
        const d = await resp.json();
        document.getElementById("s1").textContent = d.total_conversations;
        document.getElementById("s2").textContent = d.active_conversations;
        document.getElementById("s3").textContent = d.transferred_count;
        document.getElementById("s4").textContent = d.auto_resolve_rate;
    }

    async function loadKnowledge() {
        const resp = await fetch(API + "/api/knowledge/list");
        const list = await resp.json();
        document.getElementById("kbList").innerHTML = list.map(item =>
            '<tr><td>' + item.id + '</td><td>' + item.category + '</td><td>' + item.question +
            '</td><td>' + item.answer.substring(0,50) + '...</td><td><button class="del-btn" onclick="delKnowledge(' +
            item.id + ')">删除</button></td></tr>'
        ).join("");
    }

    async function addKnowledge() {
        const q = document.getElementById("kb-q").value.trim();
        const a = document.getElementById("kb-a").value.trim();
        const c = document.getElementById("kb-cat").value;
        if (!q || !a) { alert("请填写问题和答案"); return; }
        await fetch(API + "/api/knowledge/add", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({question:q, answer:a, category:c})
        });
        alert("✅ 添加成功");
        document.getElementById("kb-q").value = "";
        document.getElementById("kb-a").value = "";
        loadKnowledge();
    }

    async function delKnowledge(id) {
        if (!confirm("确认删除？")) return;
        await fetch(API + "/api/knowledge/" + id, { method: "DELETE" });
        loadKnowledge();
    }

    async function importFile() {
        const fileInput = document.getElementById("importFile");
        if (!fileInput.files[0]) { alert("请选择文件"); return; }
        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        const resp = await fetch(API + "/api/knowledge/import", { method: "POST", body: formData });
        const d = await resp.json();
        alert(d.msg);
        loadKnowledge();
    }

    function showTab(name, btn) {
        document.querySelectorAll(".panel-tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        ["add","import","list"].forEach(t => {
            document.getElementById("tab-" + t).style.display = (t === name) ? "block" : "none";
        });
        if (name === "list") loadKnowledge();
    }

    loadStats();
    loadKnowledge();
</script>
</body>
</html>
